AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Field intelligence pilot host - a cost-minimized single-instance deployment
  with durable encrypted storage, HTTPS ingress, and keyless administration

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: public subnet -> EIP -> Caddy -> Docker Compose monolith; S3 durable media; SSM ops
    must:
      - single-host pilot only; no HA claim
      - no inbound SSH; admin via SSM
      - no secrets in template or user data
      - deploy in ap-south-1 for India pilot data
    ref:
      - at: ../architecture.md
        has: pilot scope, cost choices, recovery limits
        scope: shared

Parameters:
  EnvironmentName:
    Type: String
    Default: pilot
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
    ConstraintDescription: Use 2-16 lowercase letters, digits, or hyphens.
  DomainName:
    Type: String
    Default: fieldintel.svabhu.com
    AllowedPattern: '^(?=.{1,253}$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t4g.small
      - t4g.medium
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  RootVolumeSize:
    Type: Number
    Default: 12
    MinValue: 10
    MaxValue: 50
  DataVolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 500
  AlertEmail:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Enter the email address that should receive pilot alarms.

Resources:
  PilotVpc:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: isolated low-cost network; public subnet avoids NAT hourly cost for one host
        must:
          - DNS support stays enabled for AWS endpoints and outbound providers
        mutable: change-with-constraints
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref PilotVpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: one public subnet for direct EIP ingress; transient boot IP enables package install before EIP association
        must:
          - only 80/443 allowed while transient boot IP exists
          - retained EIP becomes sole DNS target
        mutable: change-with-constraints
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref PilotVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-a'
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PilotVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-routes'

  DefaultInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: public Meta webhook and admin HTTPS; port 80 only redirects and completes ACME
        must:
          - never add SSH ingress
          - only 80/443 may be internet-facing
        mutable: review-required
    Properties:
      GroupDescription: Public HTTP and HTTPS for the field intelligence pilot
      VpcId: !Ref PilotVpc
      SecurityGroupIngress:
        - Description: ACME challenge and HTTPS redirect
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Admin application and Meta webhook
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: HTTPS for AWS, Meta, OpenAI, packages, and certificate issuance
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: DNS over UDP
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: DNS over TCP
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: Time synchronization
          IpProtocol: udp
          FromPort: 123
          ToPort: 123
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'

  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: durable tenant-scoped media, database dumps, and release artifacts outside host lifecycle
        must:
          - public access remains blocked
          - encryption and versioning remain enabled
          - deletion requires explicit data-retention review
        mutable: review-required
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireOldReleaseVersions
            Status: Enabled
            Prefix: releases/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: ExpireDatabaseBackups
            Status: Enabled
            Prefix: backups/database/
            ExpirationInDays: 35
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DataClass
          Value: field-intelligence

  StorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: enforce TLS for every principal and operation
        must:
          - aws:SecureTransport deny stays in place
    Properties:
      Bucket: !Ref StorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt StorageBucket.Arn
              - !Sub '${StorageBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ApplicationRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: private versioned ARM64 application images; GitHub/CI not required for pilot deploys
        must:
          - push linux/arm64 images for Graviton host
          - immutable tags prevent release replacement
        mutable: review-required
    Properties:
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after 7 days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep twenty four-image releases","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":80},"action":{"type":"expire"}}]}
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  InstanceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: bounded bootstrap and host logs for pilot diagnosis
        must:
          - never log message bodies, credentials, or media URLs
        mutable: free-to-tune
    Properties:
      KmsKeyId: !GetAtt AlarmKey.Arn
      LogGroupName: !Sub '/fieldintel/${AWS::StackName}/host'
      RetentionInDays: 14
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AlarmKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: encrypt alarm notifications and retained host logs with one low-cost operations key
        must:
          - key policy retains account administration plus scoped SNS and Logs access
        mutable: review-required
    Properties:
      Description: Encryption key for field intelligence pilot alarm notifications
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: SnsTopicEncryption
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: CloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/fieldintel/${AWS::StackName}/host*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AlarmTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: single alarm fan-out for host health and capacity warnings
        must:
          - alert subscription must be confirmed before testing alarms
    Properties:
      KmsMasterKeyId: !Ref AlarmKey
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: short-lived instance credentials for SSM, telemetry, S3, and ECR; no embedded keys
        must:
          - no application-provider secrets in user data
          - scope S3 and ECR access to this stack
        mutable: review-required
    Properties:
      RoleName: !Sub '${AWS::StackName}-host'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PilotRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeWorkerMediaRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-worker-media'
              - Sid: DatabaseBackupWriteAndRestore
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${StorageBucket.Arn}/backups/database/*'
              - Sid: ReleaseRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${StorageBucket.Arn}/releases/*'
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ApplicationRepository.Arn
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: FieldIntel/Pilot
              - Sid: BootstrapSignal
                Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Sid: HostLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !GetAtt InstanceLogGroup.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  WorkerMediaRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: isolate the message-processing container from host administration and backups
        must:
          - permit only inbound media object writes
          - use rotating STS credentials; never expose the instance profile to containers
        mutable: review-required
    Properties:
      RoleName: !Sub '${AWS::StackName}-worker-media'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-host'
      Policies:
        - PolicyName: InboundMediaWriteOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${StorageBucket.Arn}/companies/*/inbound/*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: reproducible hardened Graviton host; standard CPU credits cap burst-charge risk
        must:
          - AMI architecture must be arm64
          - IMDSv2 required with hop limit 2 for containers
          - root storage stays encrypted
          - bootstrap contains no secrets
        mutable: change-with-constraints
    Properties:
      VersionDescription: Initial pilot host
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: !Ref RootVolumeSize
              VolumeType: gp3
        CreditSpecification:
          CpuCredits: standard
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
          HttpTokens: required
          InstanceMetadataTags: disabled
        Monitoring:
          Enabled: false
        SecurityGroupIds:
          - !Ref WebSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-host'
              - Key: Environment
                Value: !Ref EnvironmentName
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-root'
              - Key: Environment
                Value: !Ref EnvironmentName
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail

            BASE_SIGNAL_SENT=0
            signal_instance() {
              /opt/aws/bin/cfn-signal -e "$1" \
                --stack '${AWS::StackName}' \
                --resource PilotInstance \
                --region '${AWS::Region}'
            }
            signal_failure() {
              status=$?
              if [ "$BASE_SIGNAL_SENT" -eq 0 ] && [ -x /opt/aws/bin/cfn-signal ]; then
                signal_instance "$status" || true
              fi
              exit "$status"
            }
            trap signal_failure EXIT

            # Amazon Linux 2023 ships curl-minimal, which provides the curl CLI.
            # Installing the full curl package alongside it causes a DNF conflict
            # on current AMIs and aborts the CloudFormation bootstrap.
            dnf install -y docker amazon-cloudwatch-agent aws-cfn-bootstrap jq iptables-nft xfsprogs
            install -d -m 0755 /usr/local/libexec/docker/cli-plugins
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-max-time 300 \
              --connect-timeout 10 --max-time 120 \
              https://github.com/docker/compose/releases/download/v5.4.0/docker-compose-linux-aarch64 \
              --output /usr/local/libexec/docker/cli-plugins/docker-compose
            echo 'fc5d1371f1ec7987e703da94ede49af3fbfb240b83f22991a98511de7bc4b93b  /usr/local/libexec/docker/cli-plugins/docker-compose' | sha256sum --check --strict
            chmod 0755 /usr/local/libexec/docker/cli-plugins/docker-compose
            docker compose version
            systemctl enable --now amazon-ssm-agent

            install -d -m 0750 -o ec2-user -g ec2-user /opt/fieldintel
            install -d -m 0755 /opt/fieldintel/bin
            install -d -m 0750 /var/log/fieldintel
            usermod -aG docker ec2-user

            systemctl stop docker || true
            install -d -m 0710 /var/lib/docker

            cat >/etc/docker/daemon.json <<'JSON'
            {
              "log-driver": "json-file",
              "log-opts": {"max-size": "10m", "max-file": "3"}
            }
            JSON

            cat >/opt/fieldintel/bin/block-container-metadata.sh <<'FIREWALL_SCRIPT'
            #!/bin/bash
            set -euo pipefail
            while iptables -C DOCKER-USER -d 169.254.169.254/32 -j REJECT 2>/dev/null; do
              iptables -D DOCKER-USER -d 169.254.169.254/32 -j REJECT
            done
            iptables -I DOCKER-USER 1 -d 169.254.169.254/32 -j REJECT
            if [ -x /opt/fieldintel/current/scripts/configure-container-firewall.sh ]; then
              /opt/fieldintel/current/scripts/configure-container-firewall.sh
            fi
            FIREWALL_SCRIPT
            chmod 0755 /opt/fieldintel/bin/block-container-metadata.sh
            install -d -m 0755 /etc/systemd/system/docker.service.d
            cat >/etc/systemd/system/docker.service.d/fieldintel-metadata.conf <<'DROPIN'
            [Unit]
            RequiresMountsFor=/var/lib/docker
            After=var-lib-docker.mount

            [Service]
            ExecStartPre=/usr/bin/mountpoint -q /var/lib/docker
            ExecStartPre=/usr/bin/test -f /opt/fieldintel/DATA_VOLUME_READY
            ExecStartPost=/opt/fieldintel/bin/block-container-metadata.sh
            DROPIN
            systemctl daemon-reload

            install -d -m 0750 -o root /etc/fieldintel/worker-aws
            chown root:10001 /etc/fieldintel/worker-aws
            cat >/opt/fieldintel/bin/refresh-worker-credentials.sh <<'CREDENTIAL_SCRIPT'
            #!/bin/bash
            set -euo pipefail
            ROLE_ARN='arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-worker-media'
            CREDENTIAL_JSON=''
            for attempt in $(seq 1 12); do
              if CREDENTIAL_JSON=$(aws sts assume-role --role-arn "$ROLE_ARN" \
                --role-session-name fieldintel-worker --duration-seconds 3600 --output json); then
                break
              fi
              sleep 10
            done
            test -n "$CREDENTIAL_JSON"
            TEMP_FILE=$(mktemp /etc/fieldintel/worker-aws/credentials.XXXXXX)
            chmod 0440 "$TEMP_FILE"
            chown root:10001 "$TEMP_FILE"
            jq -er '"[default]\naws_access_key_id=" + .Credentials.AccessKeyId + "\naws_secret_access_key=" + .Credentials.SecretAccessKey + "\naws_session_token=" + .Credentials.SessionToken' \
              <<<"$CREDENTIAL_JSON" >"$TEMP_FILE"
            mv -f "$TEMP_FILE" /etc/fieldintel/worker-aws/credentials
            CREDENTIAL_SCRIPT
            chmod 0750 /opt/fieldintel/bin/refresh-worker-credentials.sh
            cat >/etc/systemd/system/fieldintel-worker-credentials.service <<'CREDENTIAL_SERVICE'
            [Unit]
            Description=Refresh scoped STS credentials for the FieldIntel worker
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/opt/fieldintel/bin/refresh-worker-credentials.sh
            CREDENTIAL_SERVICE
            cat >/etc/systemd/system/fieldintel-worker-credentials.timer <<'CREDENTIAL_TIMER'
            [Unit]
            Description=Rotate FieldIntel worker STS credentials

            [Timer]
            OnBootSec=2min
            OnUnitActiveSec=40min
            Persistent=true

            [Install]
            WantedBy=timers.target
            CREDENTIAL_TIMER
            systemctl daemon-reload
            systemctl enable fieldintel-worker-credentials.timer
            systemctl start fieldintel-worker-credentials.service fieldintel-worker-credentials.timer

            cat >/opt/fieldintel/bin/mount-data-volume.sh <<'MOUNT_SCRIPT'
            #!/bin/bash
            set -euo pipefail
            MOUNT_SUCCEEDED=0
            cleanup_failed_mount() {
              status=$?
              if [ "$MOUNT_SUCCEEDED" -eq 0 ]; then
                systemctl stop docker || true
                sync
                mountpoint -q /var/lib/docker && umount /var/lib/docker || true
                rm -f /opt/fieldintel/DATA_VOLUME_READY
              fi
              exit "$status"
            }
            trap cleanup_failed_mount EXIT
            systemctl stop docker || true
            DATA_DEVICE=''
            for attempt in $(seq 1 60); do
              if [ -b /dev/xvdf ]; then
                DATA_DEVICE=/dev/xvdf
                break
              fi
              for candidate in /dev/nvme*n1; do
                [ -b "$candidate" ] || continue
                if /sbin/ebsnvme-id -b "$candidate" 2>/dev/null | grep -qx '/dev/sdf'; then
                  DATA_DEVICE="$candidate"
                  break 2
                fi
              done
              sleep 5
            done
            if [ -z "$DATA_DEVICE" ]; then
              echo 'Retained data volume did not attach as /dev/sdf' >&2
              exit 1
            fi
            SIGNATURE_TYPES=''
            if ! SIGNATURE_TYPES=$(wipefs --noheadings --output TYPE "$DATA_DEVICE" 2>/dev/null); then
              echo 'Unable to inspect the retained data volume safely' >&2
              exit 1
            fi
            if [ -z "$(printf '%s' "$SIGNATURE_TYPES" | tr -d '[:space:]')" ]; then
              mkfs.xfs "$DATA_DEVICE"
            fi
            FILESYSTEM_TYPE=''
            if ! FILESYSTEM_TYPE=$(blkid -s TYPE -o value "$DATA_DEVICE"); then
              echo 'Unable to identify the retained data volume filesystem' >&2
              exit 1
            fi
            if [ "$FILESYSTEM_TYPE" != 'xfs' ]; then
              echo "Refusing to mount unexpected data volume filesystem: $FILESYSTEM_TYPE" >&2
              exit 1
            fi
            if ! DATA_UUID=$(blkid -s UUID -o value "$DATA_DEVICE"); then
              echo 'Unable to read the retained data volume UUID' >&2
              exit 1
            fi
            if [ -z "$DATA_UUID" ]; then
              echo 'Retained data volume UUID is empty' >&2
              exit 1
            fi
            if ! grep -q "$DATA_UUID" /etc/fstab; then
              echo "UUID=$DATA_UUID /var/lib/docker xfs defaults 0 2" >> /etc/fstab
            fi
            mountpoint -q /var/lib/docker || mount /var/lib/docker
            echo 'ready' >/opt/fieldintel/DATA_VOLUME_READY
            systemctl enable --now docker
            MOUNT_SUCCEEDED=1
            trap - EXIT
            MOUNT_SCRIPT
            chmod 0755 /opt/fieldintel/bin/mount-data-volume.sh

            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 0600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            cat >/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'JSON'
            {
              "agent": {"metrics_collection_interval": 60, "run_as_user": "root"},
              "logs": {"logs_collected": {"files": {"collect_list": [
                {"file_path": "/var/log/cloud-init-output.log", "log_group_name": "${InstanceLogGroup}", "log_stream_name": "{instance_id}/cloud-init"},
                {"file_path": "/var/lib/docker/containers/*/*-json.log", "log_group_name": "${InstanceLogGroup}", "log_stream_name": "{instance_id}/containers"}
              ]}}},
              "metrics": {
                "namespace": "FieldIntel/Pilot",
                "append_dimensions": {"InstanceId": "${!aws:InstanceId}"},
                "aggregation_dimensions": [["InstanceId"]],
                "metrics_collected": {
                  "disk": {"measurement": ["used_percent"], "metrics_collection_interval": 60, "resources": ["/", "/var/lib/docker"]},
                  "mem": {"measurement": ["mem_used_percent"], "metrics_collection_interval": 60}
                }
              }
            }
            JSON
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config -m ec2 \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

            echo 'FieldIntel base bootstrap complete' >/opt/fieldintel/BASE_BOOTSTRAP_COMPLETE
            signal_instance 0
            BASE_SIGNAL_SENT=1
            trap - EXIT

  PilotInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - WorkerMediaRole
      - DefaultInternetRoute
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    Metadata:
      com.aws.cloudformation.Context:
        why: single low-traffic pilot host; resize to t4g.medium before sustained media or local scanning
        must:
          - no HA promise; restore from S3 + EBS snapshots on host loss
          - AI and transcription run via external APIs, not locally
        mutable: review-required
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: retain Docker and PostgreSQL state independently from replaceable host OS
        must:
          - never format when a filesystem already exists
          - snapshot daily and retain on stack deletion
          - remain in same AZ as pilot subnet
        mutable: must-never-change
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-data'
        - Key: fieldintel:backup
          Value: 'true'
        - Key: Environment
          Value: !Ref EnvironmentName

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: fixed device mapping lets bootstrap mount retained state before Docker starts
        must:
          - requested device remains /dev/sdf; bootstrap maps Nitro NVMe name back to it
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref PilotInstance
      VolumeId: !Ref DataVolume

  DataVolumeMountAssociation:
    Type: AWS::SSM::Association
    # Mount state only after every other fallible stack resource exists. This
    # prevents initial-create rollback from detaching a live PostgreSQL volume.
    DependsOn:
      - DataVolumeAttachment
      - ElasticIpAssociation
      - DailySnapshotPolicy
      - InstanceStatusAlarm
      - CpuHighAlarm
      - CpuCreditLowAlarm
      - MemoryHighAlarm
      - DiskHighAlarm
      - DatabaseBackupStaleAlarm
    Metadata:
      com.aws.cloudformation.Context:
        why: run after EBS attachment and block stack completion until Docker state is durably mounted
        must:
          - timeout rather than report success when EBS mount or bootstrap fails
          - rerun against a replacement instance before EIP reassociation
        mutable: change-with-constraints
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref PilotInstance
      Parameters:
        commands:
          - /opt/fieldintel/bin/mount-data-volume.sh
      WaitForSuccessTimeoutSeconds: 900

  ElasticIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: stable GoDaddy A-record target for Meta webhook callback
        must:
          - release manually if pilot is retired; idle addresses remain billable
        mutable: must-never-change
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-ip'

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref PilotInstance

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: dlm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  DailySnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: whole-host recovery complement to application-level database dumps
        must:
          - retain seven daily snapshots
          - snapshots are crash-consistent; pg_dump remains required
        mutable: change-with-constraints
    Properties:
      Description: Daily snapshots for the field intelligence pilot
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes:
          - VOLUME
        TargetTags:
          - Key: fieldintel:backup
            Value: 'true'
        Schedules:
          - Name: Daily at midnight India time
            CopyTags: true
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times:
                - '18:30'
            RetainRule:
              Count: 7
      State: ENABLED
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  InstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 system or instance status check failed
      AlarmActions:
        - !Ref AlarmTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PilotInstance
      EvaluationPeriods: 2
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Period: 60
      Statistic: Maximum
      Threshold: 1
      TreatMissingData: breaching

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU has remained above 80 percent for 15 minutes
      AlarmActions:
        - !Ref AlarmTopic
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PilotInstance
      EvaluationPeriods: 3
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Period: 300
      Statistic: Average
      Threshold: 80
      TreatMissingData: notBreaching

  CpuCreditLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Burstable CPU credit balance is low
      AlarmActions:
        - !Ref AlarmTopic
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PilotInstance
      EvaluationPeriods: 2
      MetricName: CPUCreditBalance
      Namespace: AWS/EC2
      Period: 300
      Statistic: Minimum
      Threshold: 20
      TreatMissingData: notBreaching

  MemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Host memory usage has remained above 85 percent
      AlarmActions:
        - !Ref AlarmTopic
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PilotInstance
      EvaluationPeriods: 3
      MetricName: mem_used_percent
      Namespace: FieldIntel/Pilot
      Period: 300
      Statistic: Average
      Threshold: 85
      TreatMissingData: breaching

  DiskHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Root filesystem usage has remained above 80 percent
      AlarmActions:
        - !Ref AlarmTopic
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PilotInstance
      EvaluationPeriods: 2
      MetricName: disk_used_percent
      Namespace: FieldIntel/Pilot
      Period: 300
      Statistic: Maximum
      Threshold: 80
      TreatMissingData: breaching

  DatabaseBackupStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: detect absent or stale logical PostgreSQL dumps independently of crash-consistent EBS snapshots
        must:
          - hourly health metric must report age; missing data is a failure
        mutable: change-with-constraints
    Properties:
      AlarmDescription: Latest verified PostgreSQL backup is older than 26 hours
      AlarmActions:
        - !Ref AlarmTopic
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 2
      EvaluationPeriods: 3
      MetricName: DatabaseBackupAgeSeconds
      Namespace: FieldIntel/Pilot
      Period: 3600
      Statistic: Maximum
      Threshold: 93600
      TreatMissingData: breaching

Outputs:
  ApplicationUrl:
    Description: HTTPS address after the DNS record is created and the app is deployed
    Value: !Sub 'https://${DomainName}'
  WebhookUrl:
    Description: Meta WhatsApp webhook callback URL
    Value: !Sub 'https://${DomainName}/api/v1/webhooks/whatsapp'
  ElasticIpAddress:
    Description: Add this value as the GoDaddy A record for the selected hostname
    Value: !Ref ElasticIp
  DnsRecordName:
    Description: GoDaddy host/name value
    Value: fieldintel
  InstanceId:
    Description: Target for AWS Systems Manager sessions and deployment commands
    Value: !Ref PilotInstance
  StorageBucketName:
    Description: Private bucket for media, database dumps, and release bundles
    Value: !Ref StorageBucket
  ApplicationRepositoryUri:
    Description: Private ECR repository for ARM64 application images
    Value: !GetAtt ApplicationRepository.RepositoryUri
  AlarmTopicArn:
    Description: SNS topic used by operational alarms
    Value: !Ref AlarmTopic
